packages:
  - 'source/*'

# This workspace root is a LOCAL DEVELOPMENT convenience only. Source repos are independent
# repositories that must remain installable on their own, so they declare plain
# semver ranges (never workspace:*/catalog:). When a source repo's range is satisfied by
# a local checkout, pnpm links that checkout here instead of hitting a registry.
linkWorkspacePackages: true

# Keep the local-first workflow from silently rewriting manifests back to
# workspace-only protocols: `pnpm add @aws-rex/...` saves a plain semver range
# and prefers the local checkout.
preferWorkspacePackages: true
saveWorkspaceProtocol: false

# pnpm 11+ requires explicit approval before a dependency may run install
# scripts. These are the known-good native/build toolchain packages.
allowBuilds:
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true

# A global minimumReleaseAge policy is in effect; these freshly published
# versions are allow-listed so the lockfile resolves deterministically.
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - eslint-config-next@16.3.8
  - next@16.3.8
  - vitest@5.0.3
